<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Pottery Haven</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap-grid.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/animations.css">
    <link rel="stylesheet" href="assets/css/dark.css">
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            padding: 2rem;
        }
        .auth-card {
            background: var(--surface);
            padding: 3rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 450px;
        }
        .custom-input {
            width: 100%;
            padding: 1rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-primary);
            transition: var(--transition);
            box-sizing: border-box;
        }
        .mb-input {
            margin-bottom: 1.5rem;
        }
        .custom-input:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .social-btn {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--surface);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
        }
        .social-btn:hover {
            background: var(--bg);
            transform: translateY(-2px);
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 2rem 0;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border);
        }
        .divider::before { margin-right: 1rem; }
        .divider::after { margin-left: 1rem; }
        .nav-actions-auth {
            position: absolute;
            top: 2rem;
            right: 2rem;
            display: flex;
            gap: 1rem;
        }
        .auth-btn {
            width: 100%;
            padding: 1rem;
            font-weight: 700;
            font-size: 1.1rem;
            border-radius: var(--radius-sm);
            margin-bottom: 1.5rem;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="nav-actions-auth">
        <button id="rtl-toggle" class="rtl-toggle" title="Toggle RTL">RTL</button>
        <button id="theme-toggle" class="theme-toggle">
            <i class="fas fa-moon"></i>
        </button>
    </div>
    <div class="auth-container">
        <div class="auth-card">
            <div class="text-center mb-4">
                <a href="index.html" class="logo mb-3 d-inline-flex fs-2"><i class="fas fa-palette"></i> Pottery Haven</a>
                <h1 class="h3 mb-2">Create Account</h1>
                <p class="text-secondary small">Join our creative community today.</p>
            </div>
            <form>
                <div class="mb-input">
                    <label class="form-label d-block mb-2 fw-semibold small">First Name</label>
                    <input type="text" class="custom-input" placeholder="First Name" required>
                </div>
                <div class="mb-input">
                    <label class="form-label d-block mb-2 fw-semibold small">Last Name</label>
                    <input type="text" class="custom-input" placeholder="Last Name" required>
                </div>
                <div class="mb-input">
                    <label class="form-label d-block mb-2 fw-semibold small">Email Address</label>
                    <input type="email" class="custom-input" placeholder="Enter your email" required>
                </div>
                <div class="mb-input">
                    <label class="form-label d-block mb-2 fw-semibold small">Password</label>
                    <div class="password-field-wrapper">
                        <input type="password" class="custom-input" placeholder="Enter your password" required>
                        <i class="fas fa-eye password-toggle"></i>
                    </div>
                </div>
                <div class="mb-input">
                    <label class="form-label d-block mb-2 fw-semibold small">Confirm Password</label>
                    <div class="password-field-wrapper">
                        <input type="password" class="custom-input" placeholder="Confirm your password" required>
                        <i class="fas fa-eye password-toggle"></i>
                    </div>
                </div>
                <div class="d-flex align-items-center gap-3 mb-4">
                    <input type="checkbox" id="terms" style="width: 18px; height: 18px; cursor: pointer;" required>
                    <label for="terms" class="small text-secondary" style="cursor: pointer;">I agree to the <a href="#" class="text-primary fw-semibold">Terms & Conditions</a></label>
                </div>
                <button type="submit" class="btn btn-primary auth-btn">Create Account</button>
                <div class="divider">or continue with</div>
                <div class="d-flex gap-3 mb-4">
                    <button type="button" class="social-btn">
                        <i class="fab fa-google text-danger"></i> Google
                    </button>
                    <button type="button" class="social-btn">
                        <i class="fab fa-apple"></i> Apple
                    </button>
                </div>
                <p class="text-center text-secondary small">
                    Already have an account? <a href="login.html" class="text-primary fw-bold ms-1">Sign In</a>
                </p>
            </form>
        </div>
    </div>
    <script src="assets/js/theme-toggle.js"></script>
    <script src="assets/js/rtl.js"></script>
    <script src="assets/js/password-toggle.js"></script>
</body>
</html>
