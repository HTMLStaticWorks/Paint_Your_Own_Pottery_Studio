<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Pottery Haven</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap-grid.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/animations.css">
    <style>
        .split-layout {
            display: flex;
            min-height: 100vh;
        }


        .split-form {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            position: relative;
        }

        .form-container {
            max-width: 480px;
            width: 100%;
            margin: auto;
            padding: 3rem 2rem;
        }

        .controls-top {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            display: flex;
            gap: 1rem;
            align-items: center;
            z-index: 10;
        }

        .back-link {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
            color: var(--text-secondary);
            z-index: 10;
        }

        .back-link:hover {
            color: var(--primary);
        }

        .social-btn {
            flex: 1;
            padding: 0.75rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: var(--transition);
            cursor: pointer;
        }

        .social-btn:hover {
            background: var(--bg);
            transform: translateY(-2px);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 2rem 0;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border);
        }

        .divider:not(:empty)::before {
            margin-right: .5em;
        }

        .divider:not(:empty)::after {
            margin-left: .5em;
        }

        .custom-input {
            width: 100%;
            padding: 0.875rem 1rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-primary);
            transition: var(--transition);
        }

        .custom-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
    </style>
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
</head>

<body>

    <div class="split-layout">
        <!-- Form -->
        <div class="split-form">
            <div class="controls-top">
                <button id="rtl-toggle" class="rtl-toggle" title="Toggle RTL">RTL</button>
                <button id="theme-toggle" class="theme-toggle">
                    <i class="fas fa-moon"></i>
                </button>
            </div>

            <div class="form-container">
                <div class="text-center mb-5">
                    <a href="index.html" class="logo justify-content-center mb-4" style="font-size: 2rem;">
                        <i class="fas fa-palette"></i> Pottery Haven
                    </a>
                    <h2 class="mb-2">Create an Account</h2>
                    <p class="text-secondary">Start your artistic journey with us today.</p>
                </div>

                <form>
                    <div class="row g-3 mb-4">
                        <div class="col-sm-6">
                            <label class="form-label fw-bold mb-2 d-block">First Name</label>
                            <input type="text" class="custom-input" placeholder="Jane" required>
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label fw-bold mb-2 d-block">Last Name</label>
                            <input type="text" class="custom-input" placeholder="Doe" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold mb-2 d-block">Email Address</label>
                        <input type="email" class="custom-input" placeholder="name@example.com" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold mb-2 d-block">Password</label>
                        <input type="password" class="custom-input" placeholder="••••••••" required>
                        <small class="text-secondary mt-2 d-block">Must be at least 8 characters long.</small>
                    </div>
                    <div class="mb-5">
                        <label class="d-flex align-items-center gap-3 small cursor-pointer user-select-none">
                            <input type="checkbox" style="width: 16px; height: 16px;" required>
                            <span> I agree to the <a href="#" class="text-primary fw-medium">Terms of Service</a> & <a
                                    href="#" class="text-primary fw-medium">Privacy Policy</a></span>
                        </label>
                    </div>

                    <button type="submit"
                        class="btn btn-primary py-3 rounded-3 mb-4 justify-content-center text-center"
                        style="font-size: 1.1rem; width: 100%;">Create Account</button>

                    <div class="divider">or continue with</div>

                    <div class="d-flex mb-4" style="gap: 1rem;">
                        <button type="button" class="social-btn">
                            <i class="fab fa-google text-danger"></i> Google
                        </button>
                        <button type="button" class="social-btn">
                            <i class="fab fa-facebook-f text-primary"></i> Facebook
                        </button>
                    </div>

                    <p class="text-center text-secondary">
                        Already have an account? <a href="login.html" class="text-primary fw-bold ms-1">Sign In</a>
                    </p>
                </form>
            </div>
        </div>
    </div>

    <script src="assets/js/theme-toggle.js"></script>
    <script src="assets/js/rtl.js"></script>
</body>

</html>
